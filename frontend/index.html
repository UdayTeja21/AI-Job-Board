<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Job Board</title>
  </head>
  <body>
    <script>
      window.addEventListener('error', function(event) {
        document.body.innerHTML += '<div style="color:red;z-index:999999;position:fixed;top:0;left:0;background:white;padding:20px;font-family:monospace;width:100%;height:100%;overflow:auto;"><h2>Runtime Error:</h2><p>' + event.message + '</p><pre>' + (event.error && event.error.stack ? event.error.stack : '') + '</pre></div>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="color:red;z-index:999999;position:fixed;top:0;left:0;background:white;padding:20px;font-family:monospace;width:100%;height:100%;overflow:auto;"><h2>Unhandled Promise Rejection:</h2><p>' + event.reason + '</p></div>';
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
